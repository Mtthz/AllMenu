name: Bug report
description: Something in AllMenu doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! You can write in English or Portuguese.
  - type: input
    id: version
    attributes:
      label: AllMenu version
      description: The file name you downloaded, e.g. AllMenu v1.0.00.jar
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part of AllMenu?
      options:
        - Creatures
        - Blocks or Items
        - Structures or My structures
        - Dimensions
        - Seed map
        - Ask the AI
        - Selector stick or /build
        - Other (explain below)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open the menu with O
        2. Go to the ... tab
        3. ...
  - type: dropdown
    id: where
    attributes:
      label: Where were you playing?
      options:
        - Single player
        - LAN world
        - Server
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      value: 1.20.1
  - type: input
    id: forge
    attributes:
      label: Forge version
      placeholder: 47.4.28
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: A modpack name or the list of other mods you use (JEI, OptiFine, Create...)
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images or your logs/latest.log here.
